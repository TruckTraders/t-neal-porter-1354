<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>frame test</title>
<style>body{margin:0;background:#fff;font:14px sans-serif}#log{padding:8px;background:#ffc}iframe{width:100%;height:80vh;border:4px solid red;display:block}</style></head>
<body><div id="log">start</div>
<iframe id="f" src="https://script.google.com/macros/s/AKfycbz4Zt0DzxhymXmr_-amcR3LqxYixQGnmX4pGuoD-QQzoCNw1JrjfD9KrJjhmkJAq9uz/exec"></iframe>
<script>const L=m=>{document.getElementById('log').textContent+=' | '+m};const t0=Date.now();
document.getElementById('f').addEventListener('load',()=>L('iframe load '+(Date.now()-t0)+'ms'));
document.getElementById('f').addEventListener('error',()=>L('iframe error'));</script></body></html>
